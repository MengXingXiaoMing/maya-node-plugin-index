name: auto-merge-plugin-pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "plugins/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/validate_pr.py

      - name: Comment validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f validation.md ]; then
            gh pr comment "$PR_NUMBER" --body-file validation.md
          fi

      - name: Squash merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash

      # 用 GITHUB_TOKEN 合并产生的 push 不会触发 build-catalog workflow，
      # 所以在同一个 job 里直接把 catalog.json 重建并提交。
      - name: Rebuild catalog
        if: success()
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          git checkout -B "$BASE_REF" "origin/$BASE_REF"
          python scripts/build_catalog.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog up to date"
            exit 0
          fi
          git commit -m "chore: rebuild catalog"
          git push origin "HEAD:$BASE_REF"

      # jsDelivr 会缓存 @main 分支的内容，主动清一下，市场才能立刻拿到新目录。
      - name: Purge jsDelivr cache
        if: success()
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/catalog.json" || true
